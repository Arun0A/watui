# watui.yaml - Declarative configuration for watui
#
# Place this file at ./watui.yaml or ~/.config/watui/config.yaml,
# or pass it explicitly with: watui -config /path/to/watui.yaml
#
# By default, all settings below are commented out (unconfigured).
# Uncomment any option you wish to customize.

# 1. Pinned chats / groups
# Pinned chats always appear at the top of the main screen with a [PIN] badge.
# Even with 0 unread messages, you can immediately select them with [Enter]
# to start messaging upfront without having to search contacts.
# You can specify contact names, group names, phone numbers, or WhatsApp JIDs.
#
# pin:
#   - "Work Team"
#   - "Alice Smith"
#   - "+1234567890"
#   - "120363311130744191@g.us"

# 2. Muted chats / groups
# Muted chats are completely excluded from the unread inbox list.
# Useful for spammy or low-priority groups and numbers.
# Matches contact names, group subjects (case-insensitive substring), phone numbers, or JIDs.
#
# mute:
#   - "Announcements"
#   - "Deals & Offers"
#   - "+18005550199"
#   - "120363000000000000@g.us"

# 3. Media Preview (Images, Videos, Audio, Stickers, Documents)
# Command used to preview media attachments on demand.
# Defaults to your operating system's native / MIME default viewer:
#   - Windows: rundll32 url.dll,FileProtocolHandler (Photos, Media Player, Acrobat, etc.)
#   - macOS:   open (Preview, QuickTime, etc.)
#   - Linux:   xdg-open (Desktop environment default viewer)
#
# If you prefer dedicated media players or per-file-extension applications
# (e.g. zathura for PDF, nvim for TXT/LOG, mpv, feh), customize them below:
#
# preview:
#   image: "feh -."
#   video: "mpv"
#   audio: "mpv --force-window"
#   sticker: "mpv --loop=inf"
#   document: "xdg-open"       # General fallback for documents
#   extensions:               # Per-file-extension custom viewers:
#     pdf: "zathura"          # GUI PDF viewer
#     txt: "nvim"             # Terminal editor (opens full-screen in terminal)
#     log: "less"             # Terminal pager
#     csv: "vd"               # VisiData
#     md: "glow -p"           # Markdown pager

# 4. File Picker Command (Alt+F)
# Custom command executed when pressing Alt+F to pick a file to attach.
# Terminal file pickers (yazi, ranger, lf, nnn, fzf) and GUI pickers (zenity, kdialog)
# are supported out-of-the-box.
# If omitted, automatically detects installed pickers (yazi, zenity, kdialog, etc.).
#
# Examples:
# file_picker: "yazi"
# file_picker: "ranger"
# file_picker: "fzf"
# file_picker: "zenity --file-selection"
# file_picker: "kdialog --getopenfilename"

# 5. Companion Device Name
# Name registered and displayed in WhatsApp mobile under Settings -> Linked Devices.
# Sent during first-time QR pairing registration.
# Default: "WA-TUI"
#
# device_name: "WA-TUI"

# 6. Database Directory or Path
# Explicitly set the directory containing watui.db (or the full database file path).
# If a directory is specified, watui.db will be placed and managed inside that folder.
#
# Examples:
# db_dir: "~/.local/share/watui"          # Custom directory (watui.db will be placed inside)
# db_path: "~/.local/share/watui/watui.db" # Explicit file path
# db: "./data"                             # Relative directory or database file path

# 7. Include / Alternate Config File
# Optionally load, inherit, or chain settings from another config file or directory.
#
# Examples:
# config_file: "~/.config/watui/config.yaml"
# config_dir:  "~/.config/watui"

